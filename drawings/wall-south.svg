<text x="-55" y="84" font-size="8" font-weight="400" text-anchor="start" fill="#3b3a36">· ไม่มีปลั๊กบนเคาน์เตอร์ · P5 ปลั๊กคู่จุดเดียวของครัว: ช่องล่างตู้เย็นเสียบค้าง ช่องบนไมโครเวฟ/กาต้มน้ำ · ลิ้นชักย้ายไปช่องซ้าย ซิงก์ช่องขวาโล่ง ท่อน้ำเข้า-ทิ้งเจาะผ่านแผ่นหลังตู้ฝั่งห้องน้ำ</text>
<text x="-55" y="98" font-size="8" font-weight="400" text-anchor="start" fill="#3b3a36">· หน้าต่างครัวขอบล่าง 100 พ้นเคาน์เตอร์ 85 ได้ 15 ซม. · ที่คว่ำจานสูงเกิน 15 จะบังขอบล่างหน้าต่างนิดหน่อย</text>

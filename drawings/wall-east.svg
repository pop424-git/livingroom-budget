<text x="272" y="168" font-size="15" font-weight="600" text-anchor="start" fill="#d9931f">S1 · 3 ช่อง</text>
<text x="272" y="194" font-size="15" font-weight="400" text-anchor="start" fill="#3b3a36">1 ซ้าย   โคม L1 โซนโซฟา</text>
<text x="272" y="216" font-size="15" font-weight="400" text-anchor="start" fill="#3b3a36">2 กลาง   ไฟซ่อนในห้องทั้งหมด (ผนังยาวสองด้าน)</text>
<text x="272" y="238" font-size="15" font-weight="400" text-anchor="start" fill="#3b3a36">3 ขวา    โคม L2 เหนือโต๊ะกินข้าว</text>
<text x="272" y="297.2" font-size="15" font-weight="600" text-anchor="start" fill="#d9931f">S2 · 2 ช่อง</text>
<text x="272" y="323.2" font-size="15" font-weight="400" text-anchor="start" fill="#3b3a36">1 ซ้าย   ไฟระเบียง · สั่ง 2 ทางร่วมกับสวิตช์อีกจุด (ผ่านแอป ดูหมายเหตุ)</text>
<text x="272" y="345.2" font-size="15" font-weight="400" text-anchor="start" fill="#2f6f9f">2 ขวา    ปุ่มฉาก: กด = เปิด L1 ไฟซ่อน L2 พร้อมกัน · กดอีกครั้ง = ปิดทั้งหมด</text>
<text x="272" y="367.2" font-size="15" font-weight="400" text-anchor="start" fill="#8a877f">          ช่องนี้ไม่ต่อโหลด ใช้ทริกเกอร์ Automation ในแอป Smart Life</text>
<text x="-60" y="450.4" font-size="13.5" font-weight="400" text-anchor="start" fill="#b3412c">· สวิตช์รุ่นนี้ต้องมีสาย N (Require Neutral) · สั่งช่างเดินสาย L + N เข้ากล่องสวิตช์ S1 S2 ทั้งสองกล่อง (ปกติช่างเดินแค่ L)</text>
<text x="-60" y="472.4" font-size="13.5" font-weight="400" text-anchor="start" fill="#3b3a36">· กล่องฝังผนังขนาด 2×4 นิ้ว 2 กล่องซ้อนกันแนวตั้ง · ระยะกึ่งกลางกล่องห่างกัน ~9 ซม. ให้หน้ากากไม่ชนกัน · เช็กขนาดหน้ากากจริงก่อนฝังกล่อง</text>
<text x="-60" y="494.4" font-size="13.5" font-weight="400" text-anchor="start" fill="#3b3a36">· P10 ปลั๊กกันน้ำบนระเบียง อยู่หลังผนังนี้ด้านนอก แนวเดียวกับ P2</text>
<text x="-60" y="546.4" font-size="16" font-weight="400" text-anchor="start" fill="#3b3a36">รูปด้านภายใน ผนังฝั่งประตู · 21 พ.ย. 2026</text>

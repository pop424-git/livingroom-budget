<text x="-310" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">ก่อนมุงหลังคา: ① เชื่อมหูแขวนใต้จันทัน 3 จุด (แนวเสา ห่างผนัง 1.00)  ② เจาะรูจุดโคม + จุดลงผนัง ใส่ยางกันบาด ร้อยลวดนำสายทิ้งไว้</text>
<text x="-310" y="248" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">③ ทาสี zinc กันสนิมทุกจุดที่เจาะหรือเชื่อม · ปูเดค: ไม้ยื่นเลยคานขอบนอก 3–4 ซม. ซ่อน strip IP65 · บันได IP67</text>
<text x="-310" y="272" font-size="14" font-weight="400" text-anchor="start" fill="#2f2e2b">โคม damp-rated ทรงกลมหรือหัวมน (กระดาษ / หวายสาน) ให้แสงลอดขึ้นท้องลายไม้ และไม่เป็นที่เกาะของนก</text>
<text x="-310" y="158" font-size="15" font-weight="400" text-anchor="start" fill="#6d6a62">รูปตัด · มองไปทางทิศเหนือ · หน้าต่างบานเลื่อน 3 ช่อง 180 × 110 ขอบล่าง 90 · ปรับ 19 พ.ย. 2026</text>

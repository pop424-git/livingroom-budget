<text x="-310" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#2f2e2b">ไฟระเบียง 2700K · สวิตช์ 2 ทาง S2 ในห้อง + S4 นอกผนัง เปิด/ปิดพร้อมกัน: LED strip ใต้ขอบเดค + ใต้จมูกบันได 3 ขั้น และโคมกล่องไม้ 2 ดวงใต้แป</text>
<text x="-310" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">ก่อนมุงหลังคา: ① เจาะรูร้อยสายจากจันทันแนวเสากลางเข้าแปที่ห่างผนัง 1.00 (ทะลุรอยต่อแป-จันทัน) และจุดลงผนัง ใส่ยางกันบาด</text>
<text x="-310" y="248" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">ร้อยลวดนำสายทิ้งไว้  ② ทาสี zinc กันสนิมทุกจุดที่เจาะ · ปูเดค: ไม้ยื่นเลยคานขอบนอก 3–4 ซม. ซ่อน strip IP65 · บันได IP67</text>
<text x="-310" y="272" font-size="14" font-weight="400" text-anchor="start" fill="#2f2e2b">โคมกล่องไม้ราง U 12×16 ยาว ~130 ส่องลงตรง · LED batten 120 ซม. 220V ไม่ต้องมี driver · ห่างปลายเดคข้างละ 2.40 · ป้อนไฟกลาง เดินสายเลียบแปไปทั้งสองดวง</text>
<text x="-310" y="158" font-size="15" font-weight="400" text-anchor="start" fill="#6d6a62">รูปตัด · มองไปทางทิศเหนือ · บันได 3 ขั้นซ้อน กว้าง 1.20 · หน้าต่าง 180 × 110 ขอบล่าง 90 · หลังคาประมาณจากรูปโครงจริง รอวัด · ปรับ 23 พ.ย. 2026</text>

<text x="-310" y="200" font-size="14" font-weight="400" text-anchor="start" fill="#2f2e2b">ไฟระเบียง 2700K · สวิตช์ 2 ทาง S2 ในห้อง + S4 นอกผนัง เปิด/ปิดพร้อมกัน: LED strip ใต้ขอบเดค + จมูกขั้นบันได และโคมกล่องไม้ 2 ดวงใต้แป</text>
<text x="-310" y="224" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">ก่อนมุงหลังคา: ① เจาะรูร้อยสายจากจันทันแนวเสากลางเข้าแปที่ห่างผนัง 1.00 (ทะลุรอยต่อแป-จันทัน) และจุดลงผนัง ใส่ยางกันบาด</text>
<text x="-310" y="248" font-size="14" font-weight="400" text-anchor="start" fill="#c0453a">ร้อยลวดนำสายทิ้งไว้  ② ทาสี zinc กันสนิมทุกจุดที่เจาะ · ปูเดค: ไม้ยื่นเลยคานขอบนอก 3–4 ซม. ซ่อน strip IP65 · บันได IP67</text>
<text x="-310" y="272" font-size="14" font-weight="400" text-anchor="start" fill="#2f2e2b">โคมกล่องไม้ 12×12 ยาว ~130 · LED batten 120 ซม. 220V ไม่ต้องมี driver · ห่างปลายเดคข้างละ 2.40 · ป้อนไฟกลาง เดินสายเลียบแปไปทั้งสองดวง</text>
<text x="-310" y="158" font-size="15" font-weight="400" text-anchor="start" fill="#6d6a62">รูปตัด · มองไปทางทิศเหนือ · หน้าต่างบานเลื่อน 3 ช่อง 180 × 110 ขอบล่าง 90 · หลังคาประมาณจากรูปโครงจริง รอวัด · ปรับ 23 พ.ย. 2026</text>
